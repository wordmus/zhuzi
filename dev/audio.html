<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>声音试听</title>
<style>
  :root {
    color-scheme: dark;
    --lacquer: #120d0b;
    --lacquer-2: #2a1a13;
    --cinnabar: #b33a26;
    --gold: #c9a24a;
    --silk: #e7d9b6;
    --silk-dim: #cbb98f;
    --bronze: #4f6b5a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--lacquer); color: var(--silk); }
  body { font-family: "Noto Serif SC", "Songti SC", "STSong", serif; line-height: 1.5; }
  main { max-width: 980px; margin: 0 auto; padding: 20px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; font-weight: 500; letter-spacing: .08em; }
  h2 { font-size: 15px; margin: 28px 0 10px; font-weight: 500; color: var(--gold); letter-spacing: .12em; border-bottom: 1px solid #c9a24a44; padding-bottom: 6px; }
  p.note { margin: 0; color: var(--silk-dim); font-size: 13px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin: 10px 0; }
  .row label { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--silk-dim); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 8px; }
  button {
    font: inherit; color: var(--silk); background: var(--lacquer-2); border: 1px solid #c9a24a55;
    border-radius: 6px; min-height: 44px; padding: 6px 10px; cursor: pointer; text-align: left;
    display: flex; flex-direction: column; justify-content: center; gap: 0;
  }
  button small { font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; color: var(--silk-dim); opacity: .8; }
  button:hover { border-color: var(--gold); }
  button:active { background: #3b2a1e; }
  button[aria-pressed="true"] { background: var(--bronze); border-color: var(--gold); }
  button.primary { background: var(--cinnabar); border-color: #e0b46a; text-align: center; align-items: center; }
  :focus-visible { outline: 2px solid #e0b46a; outline-offset: 2px; }
  input[type=range] { accent-color: var(--gold); width: 150px; }
  input[type=number] { width: 64px; font: inherit; background: var(--lacquer-2); color: var(--silk); border: 1px solid #c9a24a55; border-radius: 4px; padding: 4px 6px; }
  .meters { display: grid; gap: 6px; margin-top: 12px; }
  .meter { display: grid; grid-template-columns: 56px 1fr 108px; gap: 10px; align-items: center; font-size: 12px; color: var(--silk-dim); }
  .bar { height: 10px; background: #00000066; border: 1px solid #c9a24a33; border-radius: 5px; position: relative; overflow: hidden; }
  .bar i { position: absolute; inset: 0; transform-origin: left; transform: scaleX(0); background: linear-gradient(90deg, var(--bronze), var(--gold)); }
  .bar b { position: absolute; top: 0; bottom: 0; width: 2px; left: 0; background: var(--cinnabar); }
  .meter output { font-family: ui-monospace, Menlo, monospace; font-size: 11px; text-align: right; }
  #state { font-size: 13px; color: var(--silk-dim); margin: 4px 0 0; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; font-family: ui-monospace, Menlo, monospace; margin-top: 10px; }
  th, td { text-align: left; padding: 3px 8px; border-bottom: 1px solid #c9a24a22; }
  td.bad { color: #ff9a85; }
  #errors { color: #ff9a85; font-size: 12px; white-space: pre-wrap; }
</style>
</head>
<body>
<main>
  <h1>声音试听</h1>
  <p class="note">全部由 Web Audio 现场合成，没有音频文件。点任意按钮会自动解锁声音。</p>
  <p id="state">声音未解锁</p>

  <div class="row">
    <button id="unlock" class="primary" type="button">解锁声音</button>
    <label>总音量 <input id="master" type="range" min="-40" max="0" step="1" value="-14"> <output id="masterOut">-14 dB</output></label>
    <button id="mute" type="button" aria-pressed="false">静音</button>
  </div>

  <div class="meters" aria-label="电平">
    <div class="meter"><span>母线</span><div class="bar"><i id="mixBar"></i><b id="mixPeak"></b></div><output id="mixOut">-∞</output></div>
    <div class="meter"><span>输出</span><div class="bar"><i id="outBar"></i><b id="outPeak"></b></div><output id="outOut">-∞</output></div>
  </div>

  <h2>音效</h2>
  <div class="row">
    <label>序号 <input id="sfxIndex" type="number" step="1" value="0"></label>
    <label>增益 <input id="sfxGain" type="range" min="0" max="1.5" step="0.05" value="1"></label>
    <label>声像 <input id="sfxPan" type="range" min="-1" max="1" step="0.1" value="0"></label>
    <label>速率 <input id="sfxRate" type="range" min="0.5" max="2" step="0.05" value="1"></label>
  </div>
  <div id="sfx" class="grid"></div>

  <h2>环境声</h2>
  <div class="row">
    <label>电平 <input id="ambLevel" type="range" min="0" max="1.5" step="0.05" value="1"></label>
    <label>淡入毫秒 <input id="ambFade" type="number" step="100" value="1500"></label>
  </div>
  <div id="amb" class="grid"></div>

  <h2>音乐</h2>
  <div class="row">
    <button id="musicOn" type="button" aria-pressed="false" style="min-width:96px">音乐</button>
    <div id="modes" class="row" role="radiogroup" aria-label="调式" style="margin:0"></div>
    <label>紧张度 <input id="tension" type="range" min="0" max="1" step="0.05" value="0"> <output id="tensionOut">0.00</output></label>
  </div>

  <h2>编钟</h2>
  <p class="note">五声音阶的一级一钟；低一个八度的羽在最左。</p>
  <div id="bells" class="grid" style="margin-top:10px"></div>

  <h2>自检</h2>
  <div class="row">
    <button id="selftest" type="button" class="primary">离线渲染自检</button>
    <span id="selftestState" class="note"></span>
  </div>
  <div id="errors"></div>
  <table id="report" hidden></table>
</main>
<script type="module" src="./audio.ts"></script>
</body>
</html>
